<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Otakoffee Reims</title>
  <meta name="description" content="Articles et actualités d'Otakoffee, le café manga et gaming de Reims." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'AllRoundGothic';
      src: url('asset/allroundgothic-bold.otf') format('opentype');
      font-weight: 700;
      font-display: swap;
      unicode-range: U+0041-005A, U+0061-007A, U+00C0-00FF, U+0030-0039;
    }

    :root {
      --font-brand: 'AllRoundGothic', 'Nunito', sans-serif;
      --bg-dark:   #171614;
      --bg-card:   #1f1d1b;
      --text-main: #FFFFFF;
      --text-muted:#a89f98;
      --border-glow: rgba(206, 45, 79, 0.18);
      --red:  #CE2D4F;
      --rose: #F4C5DF;
      --white: #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Nunito', 'Noto Sans JP', sans-serif;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--red); border-radius: 3px; }

    /* ─── NAV ─── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 3rem;
      background: rgba(23,22,20,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-glow);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 0.5rem;
      text-decoration: none;
    }
    .nav-logo img {
      height: 40px; width: auto;
      mix-blend-mode: screen;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .nav-logo img:hover { transform: scale(1.15) rotate(-4deg); }
    .nav-logo-name {
      font-family: var(--font-brand);
      font-size: 1.1rem; color: var(--rose); letter-spacing: 2px;
    }
    .nav-back {
      display: flex; align-items: center; gap: 0.5rem;
      color: var(--text-muted); text-decoration: none;
      font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--red); }

    /* ─── PAGE ─── */
    .page-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 8rem 2rem 6rem;
    }

    /* ─── HEADER ARTICLE ─── */
    .article-header {
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-glow);
    }
    .article-label {
      font-size: 0.7rem; letter-spacing: 5px; text-transform: uppercase;
      color: var(--red); margin-bottom: 1rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .article-label::before {
      content: ''; display: block;
      width: 30px; height: 1px; background: var(--red);
    }
    .article-title {
      font-family: var(--font-brand);
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .article-title span { color: var(--red); }
    .article-meta {
      font-size: 0.82rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 1.5rem;
      flex-wrap: wrap;
    }
    .article-meta span { display: flex; align-items: center; gap: 0.4rem; }

    /* ─── IMAGE ─── */
    .article-image-wrap {
      width: 100%;
      border: 1px solid var(--border-glow);
      overflow: hidden;
      position: relative;
    }
    .article-image-wrap::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      z-index: 1;
    }
    .article-image-wrap img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s ease;
    }
    .article-image-wrap:hover img {
      transform: scale(1.01);
    }

    /* ─── FOOTER ─── */
    footer {
      background: #0e0c0b;
      border-top: 1px solid var(--border-glow);
      padding: 2rem 3rem;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.78rem; color: var(--text-muted);
      flex-wrap: wrap; gap: 1rem;
      margin-top: 5rem;
    }
    footer a { color: var(--rose); text-decoration: none; }
    footer a:hover { color: var(--white); }

    @media (max-width: 600px) {
      nav { padding: 1rem 1.5rem; }
      .page-wrapper { padding: 7rem 1.2rem 4rem; }
      footer { padding: 1.5rem; flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <img src="asset/logo otakofee temp png V2.png" alt="Otakoffee"
           onerror="this.style.display='none';" />
      <span class="nav-logo-name">Otakoffee</span>
    </a>
    <a href="index.html" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Retour au site
    </a>
  </nav>

  <div class="page-wrapper">

    <div class="article-header">
      <div class="article-label">Blog</div>
      <h1 class="article-title">Article <span>Otakoffee</span></h1>
      <div class="article-meta">
        <span>🎌 Otakoffee Reims</span>
        <span>📅 2025</span>
      </div>
    </div>

    <div class="article-image-wrap">
      <img src="asset/blog.png" alt="Article Otakoffee" />
    </div>

  </div>

  <footer>
    <span>© 2025 Otakoffee Reims — Tous droits réservés</span>
    <span>
      <a href="index.html">← Retour au site</a> &nbsp;·&nbsp;
      <a href="cgu.html">CGU</a> &nbsp;·&nbsp;
      <a href="mentions-legales.html">Mentions légales</a>
    </span>
  </footer>

</body>
</html>
